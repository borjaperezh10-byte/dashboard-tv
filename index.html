<!DOCTYPE html>
<html>
<head>
  <title>Dashboard TV Iberia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f5f7fb;
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 70px;
      background: #0a2540;
      height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
    }

    .sidebar div {
      margin: 20px 0;
      cursor: pointer;
      font-size: 20px;
    }

    /* CONTENT */
    .main {
      flex: 1;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.05);
    }

    .kpi {
      font-size: 24px;
      font-weight: bold;
      margin-top: 10px;
    }

    .positive { color: green; }
    .negative { color: red; }
    .neutral { color: gray; }

    .section {
      margin-top: 20px;
    }

  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div>🏠</div>
  <div>📊</div>
  <div>📰</div>
  <div>⚠</div>
  <div>📑</div>
  <div>⚙️</div>
</div>

<!-- MAIN CONTENT -->
<div class="main">

  <div class="header">
    <div>
      <h2>📺 Dashboard TV Iberia</h2>
      <div id="lastUpdate">Última actualización —</div>
    </div>

    <button class="button" onclick="refreshData()">🔄 Actualizar</button>
  </div>

  <!-- KPIs -->
  <div class="grid" id="kpis"></div>

  <!-- INSIGHTS -->
  <div class="section">
    <div class="card">
      <h3>🧠 Top Insights</h3>
      <ul id="insights"></ul>
    </div>
  </div>

  <!-- NOTICIAS -->
  <div class="section">
    <div class="card">
      <h3>📰 Noticias & movimientos</h3>
      <div id="news"></div>
    </div>
  </div>

  <!-- ACUERDOS -->
  <div class="section">
    <div class="card">
      <h3>📑 Tracking acuerdos</h3>
      <div id="agreements"></div>
    </div>
  </div>

</div>

<script>

let DATA = null;

function loadData() {
  fetch('data.json?t=' + new Date().getTime())
    .then(res => res.json())
    .then(data => {
      DATA = data;
      render();
    });
}

function refreshData() {

  const btn = document.querySelector(".button");
  btn.innerText = "⏳ Cargando...";

  loadData();

  setTimeout(() => {
    btn.innerText = "✅ OK";
    setTimeout(() => btn.innerText = "🔄 Actualizar", 2000);
  }, 1000);
}

function render() {

  if (!DATA) return;

  document.getElementById("lastUpdate").innerText =
    "Última actualización: " + DATA.lastUpdate;

  // KPIs
  document.getElementById("kpis").innerHTML = `
    <div class="card">
      <b>España</b>
      <div class="kpi neutral">${DATA.kpis.spain}</div>
    </div>

    <div class="card">
      <b>Portugal</b>
      <div class="kpi negative">${DATA.kpis.portugal}</div>
    </div>
  `;

  // Insights
  document.getElementById("insights").innerHTML =
    DATA.insights.map(i => `<li>${i}</li>`).join("");

  // Noticias
  document.getElementById("news").innerHTML =
    DATA.news.map(n => `<b>${n.title}</b><br>${n.impact}<br><br>`).join("");

  // Acuerdos
  document.getElementById("agreements").innerHTML =
    DATA.agreements.map(a => `
      <b>${a.operator}</b> (${a.status})<br>
      ${a.notes}<br><br>
    `).join("");

}

loadData();

</script>

</body>
</html>
