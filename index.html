<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Telco Hub — Operadores Iberia</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='12' y='28' width='76' height='52' rx='8' fill='%230064ff'/%3E%3Crect x='20' y='36' width='60' height='36' rx='3' fill='%23ffffff'/%3E%3Cline x1='38' y1='14' x2='50' y2='30' stroke='%230064ff' stroke-width='6' stroke-linecap='round'/%3E%3Cline x1='62' y1='14' x2='50' y2='30' stroke='%230064ff' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='54' r='9' fill='%230064ff'/%3E%3C/svg%3E"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div id="login-overlay" class="login-overlay">
  <div class="login-card">
    <div>
      <span class="login-title">Telco <span style="color:var(--peak-blue)">HUB</span></span>
      <div class="login-sub">Iberia Operators Intelligence</div>
    </div>
    <div class="login-body">
      <div class="login-label">Acceso restringido</div>
      <div class="login-desc">Introduce la contraseña para acceder al dashboard.</div>
      <input type="password" id="login-input" class="login-input" placeholder="Contraseña" autocomplete="off" onkeypress="if(event.key==='Enter')tryLogin()"/>
      <button class="login-btn" onclick="tryLogin()">Entrar</button>
      <div id="login-error" class="login-error"></div>
    </div>
    <div class="login-foot">© 2026 · Uso interno · Borja Pérez Herraiz</div>
  </div>
</div>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="content" id="content"></div>
  </main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
