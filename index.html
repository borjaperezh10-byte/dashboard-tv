<!DOCTYPE html>
<html>
<head>
  <title>Dashboard TV Iberia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f7fb;
    }

    header {
      background: #0a2540;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      padding: 15px;
    }

    .grid {
      display: grid;
      gap: 15px;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .kpi-value {
      font-size: 22px;
      font-weight: bold;
    }

    .positive { color: green; }
    .negative { color: red; }
    .neutral { color: gray; }

    .tag {
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 12px;
      color: white;
    }

    .precio { background: #ff6b6b; }
    .producto { background: #4dabf7; }

    select {
      padding: 5px;
      margin-bottom: 10px;
    }

  </style>
</head>

<body>

<header>
  <h1>📺 Dashboard TV Iberia</h1>
  <p id="lastUpdate"></p>
</header>

<div class="container">

  <!-- Filtro -->
  <select id="countryFilter" onchange="render()">
    <option value="all">Todos</option>
    <option value="España">España</option>
    <option value="Portugal">Portugal</option>
  </select>

  <!-- KPIs -->
  <div class="grid" id="kpis"></div>

  <!-- Cuotas -->
  <div class="card">
    <h3>🏆 Cuotas</h3>
    <ul id="shares"></ul>
  </div>

  <!-- Noticias -->
  <div class="card">
