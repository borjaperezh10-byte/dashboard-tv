<!DOCTYPE html>
<html>
<head>
  <title>Dashboard TV Iberia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      background: #f5f7fb;
    }

    /* SIDEBAR */
    .sidebar {
      width: 80px;
      background: #0a2540;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
      color: white;
    }

    .sidebar div {
      margin: 20px 0;
      cursor: pointer;
      font-size: 22px;
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
    }

    .kpi {
      font-size: 26px;
      font-weight: bold;
      margin-top: 10px;
    }

    .section {
      margin-top: 25px;
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div onclick="showHome()">🏠</div>
  <div onclick="showSpain()">🇪🇸</div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="header">
    <h2>📺 Dashboard TV Iberia</h2>
    <button class="button" onclick="refreshData()">🔄 Actualizar</button>
  </div>

  <div id="content"></div>

</div>

<script>

let DATA = null;
let currentView = "home";

function loadData() {
  fetch('data.json?t=' + new Date().getTime())
    .then(res => res.json())
    .then(data => {
      DATA = data;
      render();
    });
}

function refreshData() {
  loadData();
}

function showHome() {
  currentView = "home";
  render();
}

function showSpain() {
  currentView = "spain";
  render();
}

function render() {

  if (!DATA) return;

  if (currentView === "home") {

    document.getElementById("content").innerHTML = `
      
      <div class="grid">
        <div class="card">
          <b>🇪🇸 España</b>
          <div class="kpi">${DATA.kpis.spain}</div>
        </div>

        <div class="card">
          <b>🇵🇹 Portugal</b>
          <div class="kpi">${DATA.kpis.portugal}</div>
        </div>
      </div>

      <div class="section">
        <div class="card">
          <h3>📰 Noticias</h3>
          ${DATA.news.map(n => `
            <div>
              <b>${n.title}</b><br>
              ${n.summary}<br>
              <a href="${n.link}" target="_blank">Leer noticia</a>
              <br><br>
            </div>
          `).join("")}
        </div>
      </div>

      <div class="section">
        <div class="card">
          <h3>🧠 Top Insights</h3>
          ${DATA.insights.map(i => `
            <div>
              ${i.text}<br>
              <a href="${i.link}" target="_blank">Fuente</a>
              <br><br>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  // SECCIÓN ESPAÑA
  if (currentView === "spain") {

    document.getElementById("content").innerHTML = `
      
      <h3>🇪🇸 España - Operadores</h3>

      <div class="grid">

        ${DATA.spainOperators.map(op => `
          <div class="card">
            <b>${op.name}</b>
            <div>${op.desc}</div>
          </div>
        `).join("")}

      </div>

    `;
  }
}

loadData();

</script>

</body>
</html>
