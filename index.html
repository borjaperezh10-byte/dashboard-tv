<!DOCTYPE html>
<html>
<head>
  <title>Dashboard TV Iberia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root{
      --bg:#f5f7fb; --card:#fff; --ink:#0b1220; --muted:#667085;
      --navy:#0a2540; --shadow:0 6px 18px rgba(15, 23, 42, .08);
      --radius:14px;
      --pos:#16a34a; --neg:#dc2626; --neu:#6b7280;
      --hi:#ef4444; --med:#f59e0b; --lo:#3b82f6;
    }

    body{margin:0; font-family: Arial; background:var(--bg);}

    header{
      background:var(--navy);
      color:white;
      padding:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .container{max-width:1100px; margin:auto; padding:15px;}

    .card{
      background:white;
      padding:15px;
      border-radius:12px;
      margin-bottom:15px;
    }

    button{
      padding:8px 12px;
      border-radius:8px;
      border:none;
      background:#2563eb;
      color:white;
      cursor:pointer;
    }

    button:hover{
      background:#1d4ed8;
    }
  </style>
</head>

<body>

<header>
  <div>
    <h2>📺 Dashboard TV Iberia</h2>
    <div id="lastUpdate">Última actualización: —</div>
  </div>

  <button onclick="refreshData()">🔄 Actualizar</button>
</header>

<div class="container">

  <div class="card">
    <h3>📊 KPIs</h3>
    <div id="kpis"></div>
  </div>

  <div class="card">
    <h3>📰 Noticias</h3>
    <div id="news"></div>
  </div>

  <div class="card">
    <h3>🧠 Insights</h3>
    <ul id="insights"></ul>
  </div>

</div>

<script>

let DATA = null;

function loadData() {
  fetch('data.json?t=' + new Date().getTime())
    .then(res => res.json())
    .then(data => {
      DATA = data;
      render();
    })
    .catch(err => {
      console.error("Error cargando data.json:", err);
    });
}

function refreshData() {
  const btn = document.querySelector("button");
  btn.innerText = "⏳ Actualizando...";

  loadData();

  setTimeout(() => {
    btn.innerText = "✅ Actualizado";
    setTimeout(() => btn.innerText = "🔄 Actualizar", 2000);
  }, 1000);
}

function render() {

  if (!DATA) return;

  document.getElementById("lastUpdate").innerText =
    "Última actualización: " + DATA.lastUpdate;

  // KPIs
  document.getElementById("kpis").innerHTML = `
    España: ${DATA.kpis.spain.subs}<br>
    Portugal: ${DATA.kpis.portugal.subs}
  `;

  // Noticias
  document.getElementById("news").innerHTML =
    DATA.news.map(n => `<b>${n.title}</b> - ${n.impact}`).join("<br><br>");

  // Insights
  document.getElementById("insights").innerHTML =
    DATA.topInsights.map(i => `<li>${i}</li>`).join("");

}

// Carga inicial
loadData();

</script>

</body>
</html>
